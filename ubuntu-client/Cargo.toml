[workspace]
members = [
    ".",
    "crates/protocol",
    "crates/net-transport",
    "crates/jitter-buffer",
    "crates/video-decode",
    "crates/renderer",
    "crates/input-capture",
    "crates/diagnostics",
    "crates/decoder-experiment",
    "crates/harness-receiver",
    "crates/backend-construct",
]
resolver = "2"

[package]
name = "remote-display-client"
version = "0.1.0"
edition = "2021"

[dependencies]
protocol = { path = "crates/protocol" }
net-transport = { path = "crates/net-transport" }
jitter-buffer = { path = "crates/jitter-buffer" }
video-decode = { path = "crates/video-decode" }
renderer = { path = "crates/renderer" }
input-capture = { path = "crates/input-capture" }
diagnostics = { path = "crates/diagnostics" }
backend-construct = { path = "crates/backend-construct" }
sdl2 = "0.37"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
ffmpeg-next = "=7.1.0"
ffmpeg-sys-next = "=7.1.3"
libc = "0.2"
