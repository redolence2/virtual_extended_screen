[package]
name = "harness-receiver"
version = "0.1.0"
edition = "2021"

[dependencies]
backend-construct = { path = "../backend-construct" }
ffmpeg-next = "=7.1.0"
ffmpeg-sys-next = "=7.1.3"
serde_json = "1"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
# Not in the original dep list, but required to name the EAGAIN errno exactly
# as ffmpeg-next represents it (`Error::Other { errno }`); already resolved
# transitively via ffmpeg-next/ffmpeg-sys-next in the workspace Cargo.lock,
# so this adds no new download.
libc = "0.2"
